{{define "content"}}
<h2>{{.Subject.Name}} — Thiết lập bài thi</h2>

<article>
    <form method="POST" action="{{bp}}/exam/{{.Subject.ID}}/start">
        {{if .HasChapters}}
        <fieldset>
            <legend>Chọn chương</legend>
            <label>
                <input type="checkbox" id="check-all" checked> <strong>Tất cả</strong>
            </label>
            <hr>
            {{range .Chapters}}
            <label>
                <input type="checkbox" name="chapter_id" value="{{.ID}}" class="chapter-cb" data-count="{{.QuestionCount}}" checked>
                {{.Name}} <small>({{.QuestionCount}} câu · độ quan trọng {{.Importance}})</small>
            </label>
            {{end}}
        </fieldset>
        {{end}}

        <label for="question_count">
            Số câu hỏi (tối đa <span id="max-count">{{.Subject.QuestionCount}}</span>)
        </label>
        <input type="number" id="question_count" name="question_count"
               min="1" max="{{.Subject.QuestionCount}}" value="{{minInt .Subject.QuestionCount 25}}" required>

        <button type="submit">Bắt đầu thi</button>
    </form>
</article>

{{if .HasChapters}}
<script>
(function () {
    const all = document.getElementById('check-all');
    const cbs = Array.from(document.querySelectorAll('.chapter-cb'));
    const countInput = document.getElementById('question_count');
    const maxSpan = document.getElementById('max-count');

    function recompute() {
        let total = 0;
        cbs.forEach(cb => { if (cb.checked) total += parseInt(cb.dataset.count || '0', 10); });
        countInput.max = total;
        maxSpan.textContent = total;
        const cur = parseInt(countInput.value || '0', 10);
        if (cur > total) countInput.value = total;
    }

    all.addEventListener('change', () => {
        cbs.forEach(cb => { cb.checked = all.checked; });
        recompute();
    });
    cbs.forEach(cb => cb.addEventListener('change', () => {
        all.checked = cbs.every(c => c.checked);
        recompute();
    }));
    recompute();
})();
</script>
{{end}}
{{end}}
