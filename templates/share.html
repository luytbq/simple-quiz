{{define "content"}}
<article style="max-width: 460px; margin: 2rem auto; padding: 2rem;">
    <h2 style="text-align:center">{{.Subject.Name}}</h2>
    <p style="text-align:center">{{.Subject.QuestionCount}} câu hỏi</p>

    <form method="GET" action="{{bp}}/s/{{.ShareCode}}/start">
        {{if .HasChapters}}
        <fieldset>
            <legend>Chọn chương</legend>
            <label>
                <input type="checkbox" id="check-all" checked> <strong>Tất cả</strong>
            </label>
            <hr>
            {{range .Chapters}}
            <label>
                <input type="checkbox" name="chapter_id" value="{{.ID}}" class="chapter-cb" data-count="{{.QuestionCount}}" checked>
                {{.Name}} <small>({{.QuestionCount}} câu · độ quan trọng {{.Importance}})</small>
            </label>
            {{end}}
        </fieldset>
        {{end}}

        <label for="count">Số câu hỏi cho bài thi (tối đa <span id="max-count">{{.Subject.QuestionCount}}</span>)</label>
        <input type="number" id="count" name="count"
               min="1" max="{{.Subject.QuestionCount}}" value="{{.Subject.QuestionCount}}">

        <div class="grid">
            <button type="submit" formmethod="post" formaction="{{bp}}/practice/{{.Subject.ID}}/start">Flashcard</button>
            <button type="submit" class="outline">Thi thử</button>
        </div>
    </form>
</article>

{{if .HasChapters}}
<script>
(function () {
    const all = document.getElementById('check-all');
    const cbs = Array.from(document.querySelectorAll('.chapter-cb'));
    const countInput = document.getElementById('count');
    const maxSpan = document.getElementById('max-count');

    function recompute() {
        let total = 0;
        cbs.forEach(cb => { if (cb.checked) total += parseInt(cb.dataset.count || '0', 10); });
        countInput.max = total;
        maxSpan.textContent = total;
        const cur = parseInt(countInput.value || '0', 10);
        if (cur > total) countInput.value = total;
    }

    all.addEventListener('change', () => {
        cbs.forEach(cb => { cb.checked = all.checked; });
        recompute();
    });
    cbs.forEach(cb => cb.addEventListener('change', () => {
        all.checked = cbs.every(c => c.checked);
        recompute();
    }));
    recompute();
})();
</script>
{{end}}
{{end}}
